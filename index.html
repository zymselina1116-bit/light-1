<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candle Rope Burner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main canvas where everything is drawn -->
    <canvas id="gameCanvas"></canvas>

    <!-- Instructions overlay -->
    <div class="instructions">
        <h2>🕯️ Candle Rope Burner</h2>
        <p>Move your mouse to guide the candle flame</p>
        <p>Hold the flame over ropes to burn them!</p>
        <ul>
            <li>Thin ropes: ~3 seconds</li>
            <li>Medium ropes: ~5 seconds</li>
            <li>Thick ropes: ~8 seconds</li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
