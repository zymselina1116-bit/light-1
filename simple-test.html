<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: white; cursor: none; }
        canvas { display: block; background: white; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        console.log("=== SIMPLE TEST START ===");

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        console.log("Canvas size:", canvas.width, "x", canvas.height);

        // White background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        console.log("Drew white background");

        // Draw 5 test ropes
        console.log("Drawing 5 dark brown test ropes...");
        for (let i = 0; i < 5; i++) {
            const x = (i + 1) * canvas.width / 6;
            ctx.strokeStyle = '#4a3420';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
            console.log(`Drew rope ${i+1} at x=${x}`);
        }

        // Draw test candle
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        function drawCandle() {
            // Clear and redraw
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ropes
            for (let i = 0; i < 5; i++) {
                const x = (i + 1) * canvas.width / 6;
                ctx.strokeStyle = '#4a3420';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // Flame glow
            const flameY = mouseY - 15;
            ctx.fillStyle = 'rgba(255, 150, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(mouseX, flameY, 20, 0, Math.PI * 2);
            ctx.fill();

            // Flame
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.ellipse(mouseX, flameY, 6, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Candle body
            ctx.fillStyle = '#f4e4c1';
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            drawCandle();
        });

        drawCandle();
        console.log("=== SIMPLE TEST COMPLETE ===");
        console.log("Move your mouse to see the candle!");
    </script>
</body>
</html>
